<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 340px; padding: 10px 16px; margin: 0; }
    h3 { margin: 0 0 6px; font-size: 18px; color: #1a1a2e; }
    label { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 16px; cursor: pointer; }
    button { margin-top: 6px; width: 100%; padding: 7px; font-size: 15px; cursor: pointer;
             border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
    button:hover { background: #e0e0e0; }
    #status { font-size: 13px; color: #666; margin-top: 3px; min-height: 1px; }

    /* Cal points segmented control */
    #calPointsOpts { display: none; margin: 5px 0 0; }
    #calPointsOpts .opts-label {
      font-size: 13px; color: #666; margin-bottom: 3px;
    }
    .seg-ctrl {
      display: flex;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      font-size: 15px;
      text-align: center;
    }
    .seg-ctrl label {
      flex: 1; margin: 0; padding: 6px 6px;
      cursor: pointer; justify-content: center;
      color: #555; background: #fff;
      border-right: 1px solid #ccc;
      transition: background 0.12s, color 0.12s;
      font-size: 15px;
    }
    .seg-ctrl label:last-child { border-right: none; }
    .seg-ctrl input[type="radio"] { display: none; }
    .seg-ctrl label.selected {
      background: #eef2ff; color: #0058b0; font-weight: 600;
    }

    /* Master kill switch — compact power-button icon, lives in the header row */
    .master-toggle {
      width: 26px; height: 26px; padding: 0; margin: 0;
      border-radius: 50%; border: 1.5px solid #ccc;
      background: #f5f5f5; color: #999;
      font-size: 14px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .master-toggle.on { background: #e6f7ec; border-color: #2ecc71; color: #157347; }
    #restBody.disabled { opacity: 0.4; pointer-events: none; }

    /* Reading features section */
    .feat-sect { margin-top: 6px; border-top: 1px solid #eee; padding-top: 5px; }
    .feat-sect .sect-lbl { font-size: 13px; color: #888; margin-bottom: 2px; }
    .feat-sect label { font-size: 15px; color: #333; margin: 1px 0; }
    .l2-scale-row { display: flex; align-items: center; gap: 8px; margin: 3px 0 2px 26px; }
    .l2-scale-row input[type="range"] { flex: 1; }
    .l2-scale-row span { font-size: 13px; color: #555; width: 34px; text-align: right; flex-shrink: 0; }
    .l2-scale-row.disabled { opacity: 0.45; pointer-events: none; }

    /* HC theme button grid — each button previews its own theme's L1 colours */
    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-top: 3px; }
    .theme-btn {
      font-size: 14px; padding: 6px 6px; border: 1px solid #ccc; border-radius: 4px;
      background: #fff; color: #333; cursor: pointer;
      transition: box-shadow 0.15s ease, filter 0.15s ease;
    }
    .theme-btn:hover { filter: brightness(1.15); border-color: #999; }
    .theme-btn.selected { font-weight: 700; }

    .theme-btn[data-theme="aquatic"]  { background: #003044; color: #eaffff; border-color: #00c2e0; }
    .theme-btn[data-theme="desert"]   { background: #2b1400; color: #fff2d9; border-color: #d68a2e; }
    .theme-btn[data-theme="dusk"]     { background: #2a0a3d; color: #f5e6ff; border-color: #d64fc0; }
    .theme-btn[data-theme="nightsky"] { background: #05060f; color: #f0f4ff; border-color: #3a8fd6; }

    /* Selected state: glow ring in the theme's own accent colour, not a background swap */
    .theme-btn.selected[data-theme="aquatic"]  { box-shadow: 0 0 0 2px #00e5ff, 0 0 8px #00e5ff; }
    .theme-btn.selected[data-theme="desert"]   { box-shadow: 0 0 0 2px #ffb020, 0 0 8px #ffb020; }
    .theme-btn.selected[data-theme="dusk"]     { box-shadow: 0 0 0 2px #ff4fd8, 0 0 8px #ff4fd8; }
    .theme-btn.selected[data-theme="nightsky"] { box-shadow: 0 0 0 2px #4fc3ff, 0 0 8px #4fc3ff; }

  </style>
</head>
<body>
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
    <h3 style="margin:0;">AI Kwau ⚙️</h3>
    <div style="display:flex; align-items:center; gap:10px;">
      <button type="button" id="langToggle" style="width:auto; margin:0; padding:5px 12px; font-size:12px;">EN</button>
      <button type="button" id="masterEnabled" class="master-toggle on" aria-pressed="true">⏻</button>
    </div>
  </div>

  <div id="restBody">
  <label><input type="radio" name="mode" value="mouse"> <span data-i18n="modeMouse">滑鼠模式（PoC）</span></label>
  <label><input type="radio" name="mode" value="webcam"> <span data-i18n="modeWebcam">眼球追蹤（Webcam）</span></label>

  <label><input type="checkbox" id="cursorRingEnabled"> <span data-i18n="cursorRing">強化滑鼠指標</span></label>
  <label><input type="checkbox" id="blindSpotVisible" checked> <span data-i18n="blindSpot">顯示盲點提示</span></label>

  <div class="feat-sect">
    <div class="sect-lbl" data-i18n="sectReading">閱讀增強</div>
    <label><input type="checkbox" id="boldEnabled"> <span data-i18n="bold">文字加粗</span></label>
    <label><input type="checkbox" id="l2Enabled"> <span data-i18n="enlarge">字型放大</span></label>
    <div class="l2-scale-row" id="l2ScaleRow">
      <input type="range" id="l2Scale" min="1" max="3" step="0.1" value="1.2">
      <span id="l2ScaleLabel">1.2×</span>
    </div>
    <label><input type="checkbox" id="contrastEnabled"> <span data-i18n="contrast">加強對比</span></label>
    <label><input type="checkbox" id="summaryEnabled"> <span data-i18n="summary">段落摘要</span></label>
  </div>

  <div class="feat-sect">
    <div class="sect-lbl" data-i18n="sectTheme">高對比主題</div>
    <div class="theme-grid" id="themeGrid">
      <button type="button" class="theme-btn" data-theme="aquatic" data-i18n="themeAquatic">水域</button>
      <button type="button" class="theme-btn" data-theme="desert" data-i18n="themeDesert">沙漠</button>
      <button type="button" class="theme-btn" data-theme="dusk" data-i18n="themeDusk">黃昏</button>
      <button type="button" class="theme-btn" data-theme="nightsky" data-i18n="themeNightsky">夜空</button>
    </div>
  </div>

  <div id="calPointsOpts">
    <div class="opts-label" data-i18n="calPointsLabel">校準點數量</div>
    <div class="seg-ctrl">
      <label id="segOpt9">
        <input type="radio" name="calpts" value="9"><span data-i18n="cal9">9 點（快速）</span>
      </label>
      <label id="segOpt25">
        <input type="radio" name="calpts" value="25"><span data-i18n="cal25">25 點（精確）</span>
      </label>
    </div>
    <button id="recalibrate" style="display:none" data-i18n="recalibrate">重新校準</button>
  </div>

  <div id="webcamToggles" style="display:none; margin-top:4px;">
    <label style="font-size:15px; color:#444; display:flex; align-items:center; gap:8px; margin:1px 0; cursor:pointer;">
      <input type="checkbox" id="panelVisible" checked> <span data-i18n="showWebcamPanel">顯示 Webcam 視窗</span>
    </label>
    <label style="font-size:15px; color:#444; display:flex; align-items:center; gap:8px; margin:1px 0; cursor:pointer;">
      <input type="checkbox" id="ringVisible" checked> <span data-i18n="showGazeRing">顯示注視藍圈</span>
    </label>
  </div>

  <div id="status"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
